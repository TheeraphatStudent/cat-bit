version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: catbit_db
    environment:
      POSTGRES_DB: catbit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    networks:
      - catbit_network

  # Express.js Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: catbit_api
    # user: "1000:1000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: catbit
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: your_jwt_secret_key_here
      JWT_EXPIRES_IN: 7d
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    networks:
      - catbit_network
    # command: npm run dev

volumes:
  postgres_data:
  uploads_data:

networks:
  catbit_network:
    driver: bridge