<div class="app-container">
  
  <app-pixel-grid></app-pixel-grid>
  <!-- Navigation Header -->
  <nav class="navbar" *ngIf="showNavbar">
    <div class="nav-content">
      <div class="nav-brand">
        <h1 class="brand-title" (click)="navigateHome()">Cat bit</h1>
      </div>

      <div class="nav-links">
        <a (click)="navigate('/store')"
           [class.active]="currentRoute === '/store'"
           class="nav-link">Store</a>

        <ng-container *ngIf="currentUser">
          <a (click)="navigate('/library')"
             [class.active]="currentRoute === '/library'"
             class="nav-link">Coupons</a>

          <a (click)="navigate('/cart')"
             [class.active]="currentRoute === '/cart'"
             class="nav-link cart-link">
            Cart
            <span class="cart-badge" *ngIf="cartItemCount > 0">{{cartItemCount}}</span>
          </a>

          <a (click)="navigate('/admin-dashboard')"
             [class.active]="currentRoute === '/admin-dashboard'"
             class="nav-link"
             *ngIf="isAdmin">Admin</a>

          <div class="profile-menu" (click)="toggleProfileMenu()">
            <div class="profile-avatar">
              <img [src]="currentUser?.profileImage || '/assets/images/logo.png'" 
                   [alt]="currentUser?.username"
                   onerror="this.src='/assets/images/logo.png'">
            </div>
            <div class="profile-dropdown" *ngIf="showProfileMenu" (click)="$event.stopPropagation()">
              <div class="dropdown-header">
                <div class="dropdown-avatar">
                  <img [src]="currentUser?.profileImage || '/assets/images/logo.png'" 
                       [alt]="currentUser?.username"
                       onerror="this.src='/assets/images/logo.png'">
                </div>
                <div class="dropdown-info">
                  <div class="dropdown-name">{{currentUser?.username}}</div>
                  <div class="dropdown-email">{{currentUser?.email}}</div>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <a (click)="navigate('/profile')" class="dropdown-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                My Profile
              </a>
              <a (click)="navigate('/library')" class="dropdown-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                  <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                My Coupons
              </a>
              <div class="dropdown-divider"></div>
              <a (click)="logout()" class="dropdown-item logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
              </a>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="!currentUser">
          <a (click)="navigate('/login')"
             [class.active]="currentRoute === '/login'"
             class="nav-link">Login</a>
          <a (click)="navigate('/register')"
             [class.active]="currentRoute === '/register'"
             class="nav-btn signup-btn">Sign Up</a>
        </ng-container>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" [class.with-navbar]="showNavbar">
    <router-outlet></router-outlet>
  </main>

  <!-- <audio id="clickSound" src="../assets/sound/click.mp3"></audio> -->
</div>
