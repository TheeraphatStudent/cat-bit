<div class="pixel-alert-container">
  <div *ngFor="let alert of alerts" 
       class="pixel-alert pixel-corners-2"
       [class.success]="alert.type === 'success'"
       [class.error]="alert.type === 'error'"
       [class.warning]="alert.type === 'warning'"
       [class.info]="alert.type === 'info'"
       [@slideIn]>
    <div class="alert-content">
      <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path [attr.d]="getIcon(alert.type)"/>
      </svg>
      <div class="alert-message">
        <div class="alert-title" *ngIf="alert.title">{{alert.title}}</div>
        <div class="alert-text">{{alert.message}}</div>
      </div>
    </div>
    <button class="alert-close pixel-corners-3" (click)="removeAlert(alert.id)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
