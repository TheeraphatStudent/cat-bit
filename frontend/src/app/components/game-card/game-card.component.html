<div class="game-card" (click)="onCardClick()">
  <div class="game-image">
    <img [src]="game.image || '/assets/default-game.jpg'" 
         [alt]="game.name" 
         onerror="this.src='/assets/default-game.jpg'">
    <div class="game-rank" *ngIf="game.rank">
      #{{game.rank}}
    </div>
  </div>
  
  <div class="game-info">
    <h3 class="game-title">{{game.name}}</h3>
    <p class="game-type">{{game.type}}</p>
    <p class="game-description">{{truncateText(game.description, 100)}}</p>
    
    <div class="game-meta">
      <span class="release-date" *ngIf="game.releaseDate">
        {{formatDate(game.releaseDate)}}
      </span>
      <span class="sales-count" *ngIf="game.salesCount">
        {{formatNumber(game.salesCount)}} sold
      </span>
    </div>
    
    <div class="game-footer">
      <span class="game-price">{{formatPrice(game.price)}}</span>
      <div class="card-actions">
        <button class="btn-add-cart" 
                (click)="onAddToCart($event)" 
                [disabled]="inCart"
                *ngIf="!owned">
          {{inCart ? 'In Cart' : 'Add to Cart'}}
        </button>
        <button class="btn-owned" *ngIf="owned" disabled>
          Owned
        </button>
      </div>
    </div>
  </div>
</div>
