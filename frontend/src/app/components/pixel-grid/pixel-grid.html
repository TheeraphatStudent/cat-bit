<div id="d-overlay">
  <div class="d-wrap" 
       [style.gridTemplateColumns]="'repeat(' + cols + ', 72px)'"
       [style.gridTemplateRows]="'repeat(' + rows + ', 72px)'">
       
    <div class="d"
         *ngFor="let pixel of pixels"
         [style.animationDelay]="pixel.delay">
    </div>
  </div>
</div>
